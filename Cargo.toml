[package]
name = "waste-management"
version = "0.1.0"
edition = "2024"

[dependencies]
argon2 = "0.5"
password-hash = { version = "0.5", features = ["getrandom"] }
axum = "0.8.9"
dotenvy = "0.15.7"
jsonwebtoken = { version = "11.1.0", features = ["rust_crypto"] }
serde = { version = "1.0", features = ["derive"] }
sqlx = { version = "0.9.0", features = ["runtime-tokio", "tls-rustls", "postgres", "migrate"] }
tokio = { version = "1.53.2", features = ["rt-multi-thread", "macros"] }
tower-http = { version = "0.7.1", features = ["trace", "cors"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
